ature-title-size:21;--c-feature-body-size:19;--c-quote-size:24;--c-person-size:19;width:1500px;height:1620px;aspect-ratio:1500 / 1620;transform:none\">\u003Cdiv id=\"content\" data-vincta-layer=\"content\">\u003Csection class=\"hero-frame \" data-theme-role=\"surface\">\u003Cdiv class=\"hero-content\">\u003Cdiv class=\"content-layout\">\u003Cmain class=\"main-copy\">\u003Cp class=\"hero-eyebrow\" data-theme-role=\"label\">ACCESS WORLD-CLASS MUSIC\u003C/p>\u003Ch1 class=\"hero-title\" data-theme-role=\"title\">We’re all about originality.\u003C/h1>\u003Cp class=\"hero-lead\" data-theme-role=\"subtitle\">We’ve transformed the soundtracking experience for global brands and professional creators, with an expansive catalog of world-class music and sound effects that’s seen and heard over 3 billion times a day around the globe. \n\nProviding a direct license model that comes with all rights included and next-generation soundtracking tools, we empower creators to unlock more feeling in everything they create and share their stories with the world.\u003C/p>\u003Cp class=\"hero-copy\" data-theme-role=\"body\">We continuously enrich our world-class catalog of music by teaming up with artists, composers, and producers to create tracks spanning all genres, while supporting them financially and creatively.\u003C/p>\u003Cul class=\"features\">\u003Cli class=\"feature\" data-feature-group=\"1\">\u003Cdiv class=\"icon feature-icon\">\u003Cspan class=\"material-symbols-rounded\" aria-hidden=\"true\">login\u003C/span>\u003C/div>\u003Cdiv class=\"feature-copy\">\u003Cspan class=\"feature-title\" data-theme-role=\"label\">Sign Up.\u003C/span> \u003Cspan class=\"feature-subtitle\" data-theme-role=\"body\">Start exploring Epidemic Sound with a free trial. Discover our expansive catalog of world-class music, sound effects, and exclusive soundtracking tools.\u003C/span>\u003C/div>\u003C/li>\u003Cli class=\"feature\" data-feature-group=\"2\">\u003Cdiv class=\"icon feature-icon\">\u003Cspan class=\"material-symbols-rounded\" aria-hidden=\"true\">search\u003C/span>\u003C/div>\u003Cdiv class=\"feature-copy\">\u003Cspan class=\"feature-title\" data-theme-role=\"label\">Find your sound.\u003C/span> \u003Cspan class=\"feature-subtitle\" data-theme-role=\"body\">Find the perfect track faster than ever with our powerful search features, or browse by genre, theme, mood, and tempo. You can even use our stems and creative tools to customize your tracks.\u003C/span>\u003C/div>\u003C/li>\u003Cli class=\"feature\" data-feature-group=\"3\">\u003Cdiv class=\"icon feature-icon\">\u003Cspan class=\"material-symbols-rounded\" aria-hidden=\"true\">send\u003C/span>\u003C/div>\u003Cdiv class=\"feature-copy\">\u003Cspan class=\"feature-title\" data-theme-role=\"label\">Soundtrack your story, worry-free.\u003C/span> \u003Cspan class=\"feature-subtitle\" data-theme-role=\"body\">Bring your story to life with the perfect soundtrack. Our direct music license covers you across all markets and platforms. So you can publish your content worry-free, worldwide.\u003C/span>\u003C/div>\u003C/li>\u003C/ul>\u003Cp class=\"lower-copy\" data-theme-role=\"body\">Want to make a living, build your audience, and thrive through music? We’re always on the lookout for fresh talent.\u003C/p>\u003Cdiv class=\"subsection-block\">\u003Ch2 class=\"subsection-heading\" data-theme-role=\"title\">Our artists take center stage\u003C/h2>\u003Cp class=\"section-body-copy\" data-theme-role=\"body\">We partner fairly with artists and musicians to help them reach their creative and commercial potential.\u003C/p>\u003C/div>\u003C/main>\u003Caside class=\"testimonial\" aria-label=\"Customer testimonial\">\u003Cdiv class=\"testimonial-line\">\u003C/div>\u003Cblockquote class=\"quote\">\u003Cp class=\"quote-text\" data-theme-role=\"body\">It’s awesome to be surrounded by people, whether it’s on the Enterprise team or beyond, who have full confidence in what we are doing right now and also actively look for ways t  an expansive catalog of world-class music and sound effects that’s seen and heard over 3 billion times a day around the globe. \\n\\nProviding a direct license model that comes with all rights included and next-generation soundtracking tools, we empower creators to unlock more feeling in everything they create and share their stories with the world.\",\"bodyIntro\":\"We continuously enrich our world-class catalog of music by teaming up with artists, composers, and producers to create tracks spanning all genres, while supporting them financially and creatively.\",\"feature1Icon\":\"login\",\"feature1IconUrl\":\"\",\"feature1Title\":\"Sign Up.\",\"feature1Body\":\"Start exploring Epidemic Sound with a free trial. Discover our expansive catalog of world-class music, sound effects, and exclusive soundtracking tools.\",\"feature2Icon\":\"search\",\"feature2IconUrl\":\"\",\"feature2Title\":\"Find your sound.\",\"feature2Body\":\"Find the perfect track faster than ever with our powerful search features, or browse by genre, theme, mood, and tempo. You can even use our stems and creative tools to customize your tracks.\",\"feature3Icon\":\"send\",\"feature3IconUrl\":\"\",\"feature3Title\":\"Soundtrack your story, worry-free.\",\"feature3Body\":\"Bring your story to life with the perfect soundtrack. Our direct music license covers you across all markets and platforms. So you can publish your content worry-free, worldwide.\",\"lowerCopy\":\"Want to make a living, build your audience, and thrive through music? We’re always on the lookout for fresh talent.\",\"subheading\":\"Our artists take center stage\",\"subBody\":\"We partner fairly with artists and musicians to help them reach their creative and commercial potential.\",\"quote\":\"It’s awesome to be surrounded by people, whether it’s on the Enterprise team or beyond, who have full confidence in what we are doing right now and also actively look for ways to solve problems.  It’s a special environment which makes our jobs a 2,\"borderColor\":\"#ffffff\",\"borderOpacity\":25,\"textColor\":\"#ffffff\",\"mutedColor\":\"#c4c8de\",\"subtitleColor\":\"#e1e9ff\",\"primaryColor\":\"#5e00bd\",\"iconColor\":\"#0014ad\",\"secondaryColor\":\"#b490f5\",\"goldColor\":\"#ffd27f\",\"blueColor\":\"#3b82f6\",\"radius\":24,\"blur\":18,\"borderWidth\":1,\"reflectionOpacity\":40,\"colorwashOpacity\":82,\"glowOpacity\":42,\"contentX\":62,\"contentY\":120,\"contentRight\":62,\"contentBottom\":58,\"subtitleWidth\":735,\"featuresTop\":42,\"columnGap\":88,\"rowGap\":32,\"iconSize\":28,\"iconColumn\":38,\"iconGap\":26,\"testimonialTop\":335,\"quoteWidth\":540,\"paragraphGap\":46,\"sectionGap\":58,\"titleFont\":\"Montserrat\",\"bodyFont\":\"Poppins\",\"labelFont\":\"Comfortaa\",\"titleSize\":73,\"eyebrowSize\":24,\"subtitleSize\":23,\"bodySize\":19,\"featureTitleSize\":21,\"featureBodySize\":19,\"quoteSize\":24,\"personSize\":19,\"eyebrowGap\":18,\"titleGap\":28,\"eyebrow\":\"ACCESS WORLD-CLASS MUSIC\",\"title\":\"We’re all about originality.\",\"subtitle\":\"We’ve transformed the soundtracking experience for global brands and professional creators, with an expansive catalog of world-class music and sound effects that’s seen and heard over 3 billion times a day around the globe. \\n\\nProviding a direct license model that comes with all rights included and next-generation soundtracking tools, we empower creators to unlock more feeling in everything they create and share their stories with the world.\",\"bodyIntro\":\"We continuously enrich our world-class catalog of music by teaming up with artists, composers, and producers to create tracks spanning all genres, while supporting them financially and creatively.\",\"feature1Icon\":\"login\",\"feature1IconUrl\":\"\",\"feature1Title\":\"Sign Up.\",\"feature1Body\":\"Start exploring Epidemic Sound with a free trial. Discover our expansive catalog of world-class music, sound effects, and exclusive soundtracking tools.\",\"feature2Icon\":\"search\",\"feature2IconUrl\":\ -c-body-font:'Poppins', sans-serif, sans-serif;--c-body-size:19;--c-body-weight:500;--c-body-line-height:1.7;--c-body-letter-spacing:-0.015em;--c-body-transform:none;--c-label-font:'Comfortaa', sans-serif, sans-serif;--c-label-size:24;--c-label-weight:700;--c-label-line-height:1.25;--c-label-letter-spacing:-0.02em;--c-label-transform:none;--c-meta-font:'Poppins', sans-serif, sans-serif;--c-meta-size:19;--c-meta-weight:500;--c-meta-line-height:1.7;--c-meta-letter-spacing:-0.015em;--c-meta-transform:none;--c-tag-font:'Comfortaa', sans-serif, sans-serif;--c-tag-size:19;--c-tag-weight:700;--c-tag-line-height:1.2;--c-tag-letter-spacing:-0.02em;--c-tag-transform:none;--c-primary-action-font:'Poppins', sans-serif, sans-serif;--c-primary-action-size:13;--c-primary-action-weight:700;--c-primary-action-line-height:1.2;--c-primary-action-letter-spacing:0.08em;--c-primary-action-transform:none;--c-secondary-action-font:'Poppins', sans-serif, sans-serif;--c-secondary-action-size:13;--c-secondary-action-weight:700;--c-secondary-action-line-height:1.2;--c-secondary-action-letter-spacing:0.06em;--c-secondary-action-transform:none;--c-nav-label-font:'Poppins', sans-serif, sans-serif;--c-nav-label-size:13;--c-nav-label-weight:600;--c-nav-label-line-height:1.2;--c-nav-label-letter-spacing:0.04em;--c-nav-label-transform:none;--c-footer-label-font:'Poppins', sans-serif, sans-serif;--c-footer-label-size:12;--c-footer-label-weight:500;--c-footer-label-line-height:1.2;--c-footer-label-letter-spacing:0.04em;--c-footer-label-transform:none;--c-icon-color:#5ee7df;--c-hero-eyebrow-color:#5ee7df;--c-hero-title-color:#ffffff;--c-hero-intro-color:#e1e9ff;--c-hero-top-copy-color:#c4c8de;--c-hero-feature-title-color:#ffffff;--c-hero-feature-body-color:#c4c8de;--c-hero-lower-copy-color:#c4c8de;--c-hero-bottom-heading-color:#ffffff;--c-hero-bottom-copy-color:#c4c8de;--c-hero-quote-color:#ffffff;--c-hero-person-name-color:#ffffff;--c-hero-person-handle-color:#c4c8de;--c-hero-line-color:#5ee7df;--c-feature-title-size:21;--c-feature-body-size:19;--c-quote-size:24;--c-person-size:19;width:1500px;height:1620px;aspect-ratio:1500 / 1620;transform:none\">\u003Cdiv id=\"content\" data-vincta-layer=\"content\">\u003Csection class=\"hero-frame \" data-theme-role=\"surface\">\u003Cdiv class=\"hero-content\">\u003Cdiv class=\"content-layout\">\u003Cmain class=\"main-copy\">\u003Cp class=\"hero-eyebrow\" data-theme-role=\"label\">ACCESS WORLD-CLASS MUSIC\u003C/p>\u003Ch1 class=\"hero-title\" data-theme-role=\"title\">We’re all about originality.\u003C/h1>\u003Cp class=\"hero-lead\" data-theme-role=\"subtitle\">We’ve transformed the soundtracking experience for global brands and professional creators, with an expansive catalog of world-class music and sound effects that’s seen and heard over 3 billion times a day around the globe. \n\nProviding a direct license model that comes with all rights included and next-generation soundtracking tools, we empower creators to unlock more feeling in everything they create and share their stories with the world.\u003C/p>\u003Cp class=\"hero-copy\" data-theme-role=\"body\">We continuously enrich our world-class catalog of music by teaming up with artists, composers, and producers to create tracks spanning all genres, while supporting them financially and creatively.\u003C/p>\u003Cul class=\"features\">\u003Cli class=\"feature\" data-feature-group=\"1\">\u003Cdiv class=\"icon feature-icon\">\u003Cspan class=\"material-symbols-rounded\" aria-hidden=\"true\">login\u003C/span>\u003C/div>\u003Cdiv class=\"feature-copy\">\u003Cspan class=\"feature-title\" data-theme-role=\"label\">Sign Up.\u003C/span> \u003Cspan class=\"feature-subtitle\" data-theme-role=\"body\">Start exploring Epidemic Sound with a free trial. Discover our expansive catalog of world-class music, sound effects, and exclusive soundtracking tools.\u003C/span>\u003C/div>\u003C/li>\u003Cli class=\"feature\" data-feature-group=\"2\">\u003Cdiv class=\"icon feature-icon\">\u003Cspan class=\"material-symbols-rounded\" aria-hidden=\"true\">search\u003C/span>\u003C/div>\u003Cdiv class=\"feature-copy\">\u003Cspan class=\"feature-title\" data-theme-role=\"label\">Find your sound.\u003C/span> \u003Cspan class=\"feature-subtitle\" data-theme-role=\"body\">Find the perfect track faster than ever with our powerful search features, or browse by genre, theme, mood, and tempo. You can even use our stems and creative tools to customize your tracks.\u003C/span>\u003C/div>\u003C/li>\u003Cli class=\"feature\" data-feature-group=\"3\">\u003Cdiv class=\"icon feature-icon\">\u003Cspan class=\"material-symbols-rounded\" aria-hidden=\"true\">send\u003C/span>\u003C/div>\u003Cdiv class=\"feature-copy\">\u003Cspan class=\"feature-title\" data-theme-role=\"label\">Soundtrack your story, worry-free.\u003C/span> \u003Cspan class=\"feature-subtitle\" data-theme-role=\"body\">Bring your story to life with the perfect soundtrack. Our direct music license covers you across all markets and platforms. So you can publish your content worry-free, worldwide.\u003C/span>\u003C/div>\u003C/li>\u003C/ul>\u003Cp class=\"lower-copy\" data-theme-role=\"body\">Want to make a living, build your audience, and thrive through music? We’re always on the lookout for fresh talent.\u003C/p>\u003Cdiv class=\"subsection-block\">\u003Ch2 class=\"subsection-heading\" data-theme-role=\"title\">Our artists take center stage\u003C/h2>\u003Cp class=\"section-body-copy\" data-theme-role=\"body\">We partner fairly with artists and musicians to help them reach their creative and commercial potential.\u003C/p>\u003C/div>\u003C/main>\u003Caside class=\"testimonial\" aria-label=\"Customer testimonial\">\u003Cdiv class=\"testimonial-line\">\u003C/div>\u003Cblockquote class=\"quote\">\u003Cp class=\"quote-text\" data-theme-role=\"body\">It’s awesome to be surrounded by people, whether it’s on the Enterprise team or beyond, who have full confidence in what we are doing right now and also actively look for ways to solve problems.  It’s a special environment which makes our jobs a lot easier and more fun.\u003C/p>\u003Cfigcaption class=\"person\">\u003Cdiv class=\"avatar has-image\">\u003Cimg src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/4QBaRXhpZgAATU0AKgAAAAgABQMBAAUAAAABAAAASgMDAAEAAAABAAAAAFEQAAEAAAABAQAAAFERAAQAAAABAAAOw1ESAAQAAAABAAAOwwAAAAAAAYagAACxj//bAEMAAgEBAgEBAgICAgICAgIDBQMDAwMDBgQEAwUHBgcHBwYHBwgJCwkICAoIBwcKDQoKCwwMDAwHCQ4PDQwOCwwMDP/bAEMBAgICAwMDBgMDBgwIBwgMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDP/AABEIANIAqwMBIgACEQEDEQH/xAAfAAABBQEBAQEBAQAAAAAAAAAAAQIDBAUGBwgJCgv/xAC1EAACAQMDAgQDBQUEBAAAAX0BAgMABBEFEiExQQYTUWEHInEUMoGRoQgjQrHBFVLR8CQzYnKCCQoWFxgZGiUmJygpKjQ1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4eLj5OXm5+jp6vHy8/T19vf4+fr/xAAfAQADAQEBAQEBAQEBAAAAAAAAAQIDBAUGBwgJCgv/xAC1EQACAQIEBAMEBwUEBAABAncAAQIDEQQFITEGEkFRB2FxEyIygQgUQpGhscEJIzNS8BVictEKFiQ04SXxFxgZGiYnKCkqNTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqCg4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2dri4+Tl5ufo6ery8/T19vf4+fr/2gAMAwEAAhEDEQA/AP3AooorjNAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKwfiZ8TtB+Dngm+8R+JdTttI0bTlDz3M7YVMkAD3JJAAHrQBvVm+KPGOk+CNKlvtY1Ky0yzhXc81zMsSKPXJNfjR/wUT/4OF/EB8ca1oPw21FNJ8L2g8i3vLGPGoaif4pTMwPlR+ixqj9TvxjP5L/G39pjxl8cvEVxd6/rnibVJ5m+ee5vprmR/qXYk/jmuaWKje0dTohhpSV2f09/EL/gr1+z18Pb6Syl+JOiX1+oIWKzEtwhYdjJGjKOfejwv/wUv8DeNtfNtp3ibwG1uYfNTdrUqzt35VrcKo+rZ9hX8qmnx60YUltdSuHtyfvDdtP1HQEZHUCtnwt8QvEek3zQ2+pSxOSflaTahOOhGfr3rN4ia1sjWOGi1ZvU/rz8I/FmLxfYLd6fPp2rWePmlsblZcH0GCQcc9cV0Ol+LbXVWXyySj/KJB90N3Q91b2IHXvX8wP7Kn/BQvx38H/ElssmqX+juhVTMrF0l4OBIrHlD0IPGfwr9Q/2f/8AgsPFrWtaHc6/Haw3gm+y6lLFLugvbZ9oD9M7wcFSc4xtz83GtPFQlpLQyq4aUdVqj9T6K5X4O/GHQPjf4Jttb8O6jFqNlMMEjiSJu6up5VvYgV1VdBzhRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABX4w/8HG37cX234hQfC6wv5H03QYkmv7VflSS9cbgGIOTtiOfbcMYy2f2T17Uho2h3l2cYtYHm56fKpP9K/kZ/ao+ON/8eP2k/FWr3 ,\"borderColor\":\"#ffffff\",\"borderOpacity\":25,\"textColor\":\"#ffffff\",\"mutedColor\":\"#c4c8de\",\"subtitleColor\":\"#e1e9ff\",\"primaryColor\":\"#5e00bd\",\"iconColor\":\"#0014ad\",\"secondaryColor\":\"#b490f5\",\"goldColor\":\"#ffd27f\",\"blueColor\":\"#3b82f6\",\"radius\":24,\"blur\":18,\"borderWidth\":1,\"reflectionOpacity\":40,\"colorwashOpacity\":82,\"glowOpacity\":42,\"contentX\":62,\"contentY\":120,\"contentRight\":62,\"contentBottom\":58,\"subtitleWidth\":735,\"featuresTop\":42,\"columnGap\":88,\"rowGap\":32,\"iconSize\":28,\"iconColumn\":38,\"iconGap\":26,\"testimonialTop\":335,\"quoteWidth\":540,\"paragraphGap\":46,\"sectionGap\":58,\"titleFont\":\"Montserrat\",\"bodyFont\":\"Poppins\",\"labelFont\":\"Comfortaa\",\"titleSize\":73,\"eyebrowSize\":24,\"subtitleSize\":23,\"bodySize\":19,\"featureTitleSize\":21,\"featureBodySize\":19,\"quoteSize\":24,\"personSize\":19,\"eyebrowGap\":18,\"titleGap\":28,\"eyebrow\":\"ACCESS WORLD-CLASS MUSIC\",\"title\":\"We’re all about originality.\",\"subtitle\":\"We’ve transformed the soundtracking experience for global brands and professional creators, with an expansive catalog of world-class music and sound effects that’s seen and heard over 3 billion times a day around the globe. \\n\\nProviding a direct license model that comes with all rights included and next-generation soundtracking tools, we empower creators to unlock more feeling in everything they create and share their stories with the world.\",\"bodyIntro\":\"We continuously enrich our world-class catalog of music by teaming up with artists, composers, and producers to create tracks spanning all genres, while supporting them financially and creatively.\",\"feature1Icon\":\"login\",\"feature1IconUrl\":\"\",\"feature1Title\":\"Sign Up.\",\"feature1Body\":\"Start exploring Epidemic Sound with a free trial. Discover our expansive catalog of world-class music, sound effects, and exclusive soundtracking tools.\",\"feature2Icon\":\"search\",\"feature2IconUrl\":\"
