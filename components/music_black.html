<script>
(function () {
  var DW = 800;
  var DH = 600;
  var root = document.getElementById('vincta-design-root');
  var viewport = document.getElementById('vincta-design-viewport');
  var shell = document.getElementById('vincta-design-shell');
  if (!root || !viewport || !shell || !(DW > 0) || !(DH > 0)) return;

  function fit() {
    var rw = root.clientWidth || 0;
    var rh = root.clientHeight || 0;
    var s = 1;
    if (rw > 0 && rh > 0) {
      s = Math.min(rw / DW, rh / DH);
    } else if (rw > 0) {
      s = rw / DW;
    } else if (rh > 0) {
      s = rh / DH;
    }
    if (!isFinite(s) || s <= 0) s = 1;
    viewport.style.width = (DW * s) + 'px';
    viewport.style.height = (DH * s) + 'px';
    shell.style.transform = 'scale(' + s + ')';
  }

  if (typeof ResizeObserver !== 'undefined') {
    try {
      new ResizeObserver(fit).observe(root);
    } catch (e) {}
  }
  window.addEventListener('resize', fit);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fit);
  } else {
    fit();
  }
})();
