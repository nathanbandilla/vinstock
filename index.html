<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VINSTOCK MUSIC</title>
  <meta name="description" content="This is an engaging music marketplace with vinstock components">
  
  <!-- Warm DNS/TLS for iframe font requests. Fonts still must load inside each iframe. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Edu+TAS+Beginner:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #e2d63186;      
      --panel: #eaece3;
      --lightpanel: #fff8ef; 
      --border: #2a2a2e;
      --text: #363636;
      --muted: #686868;
      --feature1: #4e1445c2;
      --feature2: #bb00ab;
      --feature3: #d1d400;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      overflow-x: hidden;
    }
    .hero-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: visible;
    }
    .hero-pair {
      position: relative;
      width: 100%;
    }
    .float-bg {
      position: absolute;
      z-index: 0;
      left: 50%;
      top: 0;
      width: 100vw;
      max-width: none;
      height: 100%;
      transform: translateX(-50%);
      overflow: hidden;
      pointer-events: none;
    }
    .float-bg iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .float-bg2 {
      position: absolute;
      z-index: 0;
     
      top: 0;
      width: 100vw;
      max-width: none;
      height: 100%;
      transform: translateX(-50%);
      overflow: hidden;
      pointer-events: none;
    }
    .float-bg2 iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .music-hero {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
    }
   /* Mobile styles (default) */
    .float-element {
      position: absolute;
      top: 40px;      
    }

    /* Desktop styles (screens 768px wide and up) */
    @media (min-width: 768px) {
    .float-element {
        position: absolute;
        top: -60px;     
      }
    }
    /* Mobile styles (default) */
      .float-element2 {
      position: absolute;
      top: -40px;      
    }

    /* Desktop styles (screens 768px wide and up) */
    @media (min-width: 768px) {
    .float-element2 {
        position: absolute;
        top: 80px;         
      }
    }

    /* Mobile styles (default) */
    .float-element3 {
      position: absolute;
      transform: scale(50%);
      top: 230px; 
      left: 0px;     
    }

    /* Desktop styles (screens 768px wide and up) */
    @media (min-width: 768px) {
      .float-element3 {
        position: absolute;        
        top: 250px;   
        left: 570px;  
      }
    }
    .hero-stage > .hero,
    .hero-pair > .hero,
    .hero-stage > .stack {
      position: relative;
      z-index: 10;
    }
    .hero-stage .frame.hero {
      background: transparent;
      border: 0;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
    }
    .hero-stage .frame.hero iframe {
      height: auto;
      aspect-ratio: 3 / 2;
    }
    @media (max-width: 800px) {
      .float-bg {
        width: 100vw;
        max-width: none;
        height: 100%;
        top: 0;
        transform: translateX(-50%);
      }
      .float-bg2 {
        width: 100vw;
        max-width: none;
        height: 100%;
        top: 0;
        transform: translateX(-50%);
      }
      #top-hero-stage {
        min-height: auto;
      }
     
    }
    .header,
    .footer {
      height: 200px;
      margin: 0 auto;
      padding: 0;
      background: var(--lightpanel);
    }
    .header iframe,
    .footer iframe {
      width: 100%;
      height: 100%;
    }
  
    main {
      position: relative;
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 80px 0 80px;
    }
    main .hero-stage {
      min-height: 100vh;
      min-height: 100dvh;
    }
    main .hero-stage > .stack {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto 20px;
      padding: 0;
    }
    main .hero-stage > .stack:last-child {
      margin-bottom: 0;
    }
    h1 {
      font-size: 40px;
      font-weight: 650;
      margin: 0 0 8px;
      padding: 50px;
      color: var(--muted);
    }
    h2 {
      font-size: 20px;
      font-weight: 200;
      margin: 0 0 8px;
      color: var(--muted);
    }
    p {
      color: var(--muted);
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .stack { 
        display: grid; 
        gap: 80px;        
    }
    .row {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr 1fr;
    }  
    @media (max-width: 800px) {
      .row { grid-template-columns: 1fr; }
    }
    .frame {     
      border: 1px solid var(--border);
      border-radius: 40px;
      overflow: hidden;
      background: var(--panel); 
    }
    .frame-feature {
      width: 100%;
      max-width: 1440px; 
      background: transparent;
      border: 0;
      overflow: hidden;
    }
    .frame-feature iframe {
      width: 100%;
      height: auto;
      /* position: absolute; */
      min-height: 50vh;
      min-height: 50dvh;
      /* margin: -50px auto 0; */
      /* position: relative; */
      /* z-index: 11;     */
      
    }
    .frame-feature1 {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      background: var(--feature1);
      border: 0;
      overflow: hidden;
    }
    .frame-feature1 iframe {
      width: 100%;
      height: auto;
      min-height: 170vh;
      min-height: 170dvh;
    
    }
    @media (max-width: 1440px) {
      .frame-feature1 {
        max-width: 100%;
      }
      .frame-feature1 iframe {
        min-height: 170vh;
        min-height: 170dvh;
      }
    }
    .frame-feature2 {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      background: var(--feature2);
      border: 0;
      overflow: hidden;
    }
    .frame-feature2 iframe {
      width: 100%;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;      
    }
    @media (max-width: 1440px) {
      .frame-feature2 {
        max-width: 100%;
      }
      .frame-feature2 iframe {
        min-height: 100vh;
        min-height: 100dvh;
      }
    }
    .frame h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    iframe {
      display: block;
      width: 100%;     
      border: 0;
      background: transparent;
    }
    /* .hero iframe { height: 100vh; } */
    /* .logo iframe { height: 280px; } */
    /* .badge iframe { height: 360px; } */
  </style>
</head>

<body>
    <header class="header">
        <iframe src="components/Logo.html" title="Vinstock Music" loading="eager"></iframe>
    </header>

    <div style="text-align: center; font-style: italic;">  
         
        <h1>"You bring the idea.
            We bring the sound."</h1>

  <section class="hero-stage" id="top-hero-stage">

    </div>

    <!-- <section class="frame hero tab">
      <iframe src="components/tab_black_adaptive.html" title="Site tabs" loading="lazy"></iframe>
    </section> -->

  <main>
    <div class="hero-stage">

      <div class="float-bg2" aria-hidden="true" style=" transform: scaleX(-1);">

      </div> 
        
      <!-- contents -->
      <section class="stack">

            <iframe src="components/tabs.html" title="feature tabs" style="height: 400px;;" loading="lazy"></iframe>

        <section class="frame frame-feature" style="position: absolute; width: 600px;  margin-right: 20%; display: block;  transform: rotate(0.1turn);" >
            <iframe src="components/cart.html" title="cart" loading="lazy"></iframe>
          </section>

          
        <section class="frame frame-feature" style="position: absolute; width: 90%; margin-left: 60%; display: block;">
            <iframe src="components/geometric_circle.html" title="star" style="width: 40%;" loading="lazy"></iframe>
          </section>

          <section class="frame frame-feature1">
            <iframe src="components/content_glass_white_adaptive.html" title="Featured content" loading="lazy" scrolling="no" style="overflow:hidden;"></iframe>
        </section>
      
          <!-- <section class="frame frame-feature" >
            <iframe src="components/border_animate.html" title="Discover" loading="lazy" style="position: absolute; margin: -750px auto 0; height: 900px;"></iframe>
          </section> -->

        <!-- <div class="row">  

            <section class="frame">
                <iframe src="Enroll_Badge_glow.html" title="Enroll now badge" loading="lazy"></iframe>
              </section>        

            <section class="frame">
              <iframe src="Enroll_Badge_glow.html" title="Enroll now badge" loading="lazy"></iframe>
            </section>

        </div> -->
      </section>
     
    </div>


    <!-- Bottom Contents -->
    <div class="hero-stage">

      <!-- <div class="float-bg" style="background-color: #e2d63186;">
        <iframe src="components/hero_animate.html" title="Section background" loading="lazy"></iframe>
      </div>  -->

      <section class="stack">

        <section class="frame frame-feature float-element" >
          <iframe src="components/discover_now.html" title="Discover" loading="lazy"></iframe>       
        </section>

        <div style="text-align: center;">          
          <h1>See sample features from our product platforms.</h1>              
        </div>
       
        <section class="frame frame-feature2" style="max-height: 500px; background-color: #ff99008c;">
          <iframe src="components/notifications_adaptive.html" title="notifications" loading="lazy"></iframe>
        </section>    
        
      </section>

      <section class="stack" style="padding-top: 60px;">

        <section class="frame frame-feature float-element2" >
          <iframe src="components/text_magic_yellow.html" title="magic text" loading="lazy"></iframe>       
        </section>
  
        <section class="frame frame-feature" style="background-color: #ff00d44f;"">
            <iframe src="components/cell_animate.html" title="Cells" loading="lazy"></iframe>
          </section>

          <section class="frame frame-feature float-element3">
            <iframe src="components/buy_now.html" title="buy now" loading="lazy"></iframe>       
          </section>
  
          <section class="frame frame-feature2" style="overflow: hidden; background-color: transparent;" >
            <iframe src="components/contact_white_adaptive.html" title="contact" loading="lazy" scrolling="no"  style="overflow: hidden;"></iframe>
          </section>

      </section>

    </div>

    
  </main>

  <footer class="footer">
    <div class="hero" style="padding: 20px  ; text-align: center;"> <p>Copyright Vinstock Music 2026</p></div>
   
    <!-- <iframe src="components/hero_animate.html" title="Site footer" loading="lazy"></iframe> -->
  </footer>

</body>
</html>
