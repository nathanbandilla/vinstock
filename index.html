<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VINSTOCK MUSIC</title>
  <meta name="description" content="This is an engaging music marketplace with vinstock components">
  
  <!-- Warm DNS/TLS for iframe font requests. Fonts still must load inside each iframe. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Edu+TAS+Beginner:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0b0c;
      --panel: #141416;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    header, footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    header.frame, footer.frame { margin: 16px auto; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 650;
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .stack { display: grid; gap: 20px; }
    .row {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 800px) {
      .row { grid-template-columns: 1fr; }
    }
    .frame {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .frame h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    iframe {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
    }
    .hero iframe { height: min(70vh, 560px); }
    .logo iframe { height: 280px; }
    .badge iframe { height: 360px; }
  </style>
</head>

<body>
  <header class="frame logo">
    <!-- Header -->
    <iframe src="components/tab_white_adaptive.html" title="Site header" loading="eager"></iframe>
  </header>

  <main>
    <div style="text-align:center;">        
        <h1>VINSTOCK MUSIC</h1>
         <p>Each block loads its own HTML file. Do not paste Vincta srcdoc into a script tag — a nested <code>&lt;/script&gt;</code> 
        will break the page.</p>
    </div>    

    <div class="stack">
      <section class="frame hero">
        <!-- <h2>HEROC</h2> -->
        <iframe src="components/hero_animate.html" width="100%" title="Hero animation" loading="eager"></iframe>
      </section>

      <div class="row">
        <section class="frame logo">
          <!-- <h2>Logo</h2> -->
          <iframe src="Coach_Vin_Logo.html" title="Coach Vin logo" loading="lazy"></iframe>
        </section>
        <section class="frame badge">
          <!-- <h2>Enroll</h2> -->
          <iframe src="Enroll_Badge_glow.html" title="Enroll now badge" loading="lazy"></iframe>
        </section>
      </div>

      <section class="frame hero">
        <!-- <h2>Featured clip</h2> -->
        <iframe src="components/hero_animate.html" title="Featured clip" loading="lazy"></iframe>
      </section>

      <section class="frame badge">
        <!-- <h2>Call to action</h2> -->
        <iframe src="Enroll_Badge_glow.html" title="Call to action" loading="lazy"></iframe>
      </section>
    </div>
  </main>

  <footer class="frame badge">
    <!-- <h2>Footer</h2> -->
    <iframe src="Enroll_Badge_glow.html" title="Site footer" loading="lazy"></iframe>
  </footer>
</body>
</html>
